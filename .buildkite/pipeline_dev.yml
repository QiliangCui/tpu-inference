# Dev pipeline: multi-host serve + benchmark from a locally-built prebuilt image.
#
# Image is pushed off-pipeline as .../vllm-tpu:${COMMIT}-${VLLM_COMMIT_HASH}-${TPU_VERSION}
# (VLLM_COMMIT_HASH = .buildkite/vllm_lkg.version). USE_PREBUILT_IMAGE=1 +
# IS_MULTI_HOST_BENCH=true makes run_multihost.sh pull that tag and distribute it
# to all hosts; no build step needed.
#
# Serve config A: TP=32/EP=32, DCP=1, token budget 8192, seqs 400, fp8 KV,
# stock scheduler, text-only checkpoint (the multimodal wrapper cannot boot at
# TP=32: the vision tower has 12 KV heads and 32 % 12 != 0).
#
# This run is about ACCURACY. GSM8K is run twice against the same serve
# session -- once on a freshly loaded model and once after the perf points --
# so the pair brackets ~2800 requests. That is the cheap stand-in for the
# reference runs' before/after teacher-forced gate, and it is the check that
# matters against the open EP=32 weight-corruption defect (reported clean to
# 168 requests, corrupt by 216). C=1 and C=16 are re-measured in between:
# they are the two TP32 best-envelope points, and they supply the request
# volume between the brackets.
#
# The client first PROBES three protocols on 100 problems and then runs the
# winner in full, because the reference command's --apply_chat_template is not
# straightforward to reproduce: K3 implements apply_chat_template in Python
# rather than as a jinja string, and lm_eval's local-completions path does not
# render it (it posts raw message dicts and then crashes). The working route is
# local-chat-completions, letting vLLM apply the template server-side. That
# template opens a thinking channel at thinking_effort=max, and lm_eval's stop
# strings are not K3's, so the probe also tests a 256- vs 1024-token budget to
# see whether truncation is what wrecks strict-match.
#
# lm_eval runs from an isolated venv (/opt/lmeval) so its torch/transformers
# cannot perturb the pinned serving stack.
#
# BENCH_MODEL must be passed to the client and must equal the serve --model
# string: the client puts it in the request payload's "model" field, and the
# server's served-model-name defaults to its own --model, so any mismatch
# 404s every request (silently, after the full multi-host boot).

# The single-host serve gate is intentionally omitted for this run: it exists
# to validate the gs:// loader + tokenizer + serve path cheaply before taking
# the 32-device pod, and that path has already passed on this image (same
# manifest digest) with this exact serve command. Keeping it would only park
# an idle 32-pod behind a contended 2-chip queue. Restore it for any run that
# changes the image, the model path, or the serve flags.
steps:
  - label: "tpu7x-32 [prebuilt] serve+acc arm A (gsm8k 8-shot)"
    key: arma_acc8
    timeout_in_minutes: 600
    env:
      USE_PREBUILT_IMAGE: "1"
      IS_MULTI_HOST_BENCH: "true"
      TPU_VERSION: "tpu7x"
      NEW_MODEL_DESIGN: "1"
      SERVER_READY_TIMEOUT: "14400"
      EXTRA_SERVER_ENVS: "MIN_TOKEN_BUCKET=32 DISABLE_WEIGHT_REQUANTIZATION=1 VLLM_ENGINE_READY_TIMEOUT_S=14400 JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS=0.05"
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - |
        MODEL="gs://tpu-commons-ci/moonshootai/kimi/k3-textonly"
        .buildkite/scripts/run_multihost.sh \
          "vllm serve \${MODEL} \
            --trust-remote-code \
            --tensor-parallel-size 32 \
            --distributed-executor-backend ray \
            --max-model-len 9216 \
            --max-num-batched-tokens 8192 \
            --max-num-seqs 400 \
            --gpu-memory-utilization 0.9 \
            --load-format runai_streamer \
            --additional-config '{\"sharding\":{\"sharding_strategy\":{\"enable_dp_attention\":true,\"attn_dp_size\":1}}}' \
            --no-enable-prefix-caching \
            --limit-mm-per-prompt '{\"image\":0,\"video\":0}' \
            --disable-chunked-mm-input \
            --kv-cache-dtype fp8 \
            --enable-expert-parallel \
            --port 8899" \
          "BENCH_MODEL=\${MODEL} GSM8K_MODE=b775 GSM8K_FEWSHOT=8 GSM8K_TAG=tp32_gsm8k_8shot bash /workspace/run_gsm8k.sh"
