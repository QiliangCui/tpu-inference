# Dev pipeline: run a LOCALLY-BUILT image on tpu-inference-dev.
#
# The image is built off-pipeline and pushed to the CI Artifact Registry as
#   .../vllm-tpu:${BUILDKITE_COMMIT}-${VLLM_COMMIT_HASH}-${TPU_VERSION}
# where VLLM_COMMIT_HASH comes from .buildkite/vllm_lkg.version.
# `USE_PREBUILT_IMAGE=1` makes run_in_docker.sh pull that tag instead of
# building vLLM + tpu-inference on a CPU agent, so no build step is needed.

steps:
  - label: "tpu7x [prebuilt] provenance + unit tests"
    key: prebuilt_unit
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
    agents:
      queue: tpu_v7x_2_queue
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh bash -c '
        set -eux
        cd /workspace/tpu_inference
        python3 -c "import vllm, tpu_inference; print(\"vllm\", vllm.__version__); print(\"tpu_inference\", tpu_inference.__file__)"
        python3 -m pytest -q tests/layers/common/test_k3_fused_moe_contract.py
        # pp_ici transport tests skip unless 16 devices are visible; emulate on CPU.
        JAX_PLATFORMS=cpu XLA_FLAGS="--xla_force_host_platform_device_count=16" \
          python3 -m pytest -q tests/pp_ici/test_pp_ici_transport.py'

  - label: "tpu7x [prebuilt] offline inference smoke (torchax)"
    key: prebuilt_smoke
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "vllm"
    agents:
      queue: tpu_v7x_2_queue
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh bash -c '
        set -eux
        cd /workspace/tpu_inference
        VLLM_XLA_CHECK_RECOMPILATION=0 python3 examples/offline_inference.py \
          --model Qwen/Qwen3-0.6B --tensor_parallel_size 1 --max_model_len 512'
