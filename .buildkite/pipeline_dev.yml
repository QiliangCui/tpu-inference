# Dev pipeline: multi-host serve + benchmark from a locally-built prebuilt image.
#
# Image is pushed off-pipeline as .../vllm-tpu:${COMMIT}-${VLLM_COMMIT_HASH}-${TPU_VERSION}
# (VLLM_COMMIT_HASH = .buildkite/vllm_lkg.version). USE_PREBUILT_IMAGE=1 +
# IS_MULTI_HOST_BENCH=true makes run_multihost.sh pull that tag and distribute it
# to all hosts; no build step needed.
#
# Serve config B: PP=4 x EP=8, fp8 KV, token budget 1024, seqs 512, async
# stagger scheduler. Benchmark: random 8192/1024, range-ratio 0.8 (pinned
# reference harness), points C=100/200 -- the two reference best-envelope
# rows not yet covered (C=32 and C=512 were measured in build 826).
# N convention: 10xC for C<=100, 2048 for C>=200.
#
# GSM8K runs in the SAME serve session right after the sweep, so the accuracy
# number belongs to the exact process that produced the perf numbers and also
# reflects any weight damage accumulated over the sweep's requests. Protocol:
# lm_eval gsm8k_cot, 8-shot, 1319 problems, num_concurrent=4 / batch_size=1 /
# timeout=1800, matching the reference run. It runs from an isolated venv
# (/opt/lmeval) so its torch/transformers cannot perturb the serving stack.
#
# BENCH_MODEL must be passed to the client and must equal the serve --model
# string: the client puts it in the request payload's "model" field, and the
# server's served-model-name defaults to its own --model, so any mismatch
# 404s every request (silently, after the full multi-host boot).

# The single-host serve gate is intentionally omitted for this run: it exists
# to validate the gs:// loader + tokenizer + serve path cheaply before taking
# the 32-device pod, and that path has already passed on this image (same
# manifest digest) with this exact serve command. Keeping it would only park
# an idle 32-pod behind a contended 2-chip queue. Restore it for any run that
# changes the image, the model path, or the serve flags.
steps:
  - label: "tpu7x-32 [prebuilt] serve+bench arm B (C=100,200)"
    key: armb_sweep
    timeout_in_minutes: 600
    env:
      USE_PREBUILT_IMAGE: "1"
      IS_MULTI_HOST_BENCH: "true"
      TPU_VERSION: "tpu7x"
      NEW_MODEL_DESIGN: "1"
      SERVER_READY_TIMEOUT: "14400"
      EXTRA_SERVER_ENVS: "MIN_TOKEN_BUCKET=16 VLLM_PP_LAYER_PARTITION=24,24,24,21 TPU_PP_TRANSPORT=auto DISABLE_WEIGHT_REQUANTIZATION=1 VLLM_ENGINE_READY_TIMEOUT_S=14400 JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS=0.05"
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - |
        MODEL="gs://tpu-commons-ci/moonshootai/kimi/k3"
        .buildkite/scripts/run_multihost.sh \
          "vllm serve \${MODEL} \
            --trust-remote-code \
            --tensor-parallel-size 8 \
            --pipeline-parallel-size 4 \
            --distributed-executor-backend ray \
            --max-model-len 9216 \
            --max-num-batched-tokens 1024 \
            --max-num-seqs 512 \
            --gpu-memory-utilization 0.92 \
            --load-format runai_streamer \
            --additional-config '{\"sharding\":{\"sharding_strategy\":{\"enable_dp_attention\":true,\"attn_dp_size\":1}}}' \
            --no-enable-prefix-caching \
            --limit-mm-per-prompt '{\"image\":0,\"video\":0}' \
            --disable-chunked-mm-input \
            --kv-cache-dtype fp8 \
            --enable-expert-parallel \
            --scheduler-cls tpu_inference.core.sched.pp_stagger_scheduler.PpStaggerAsyncScheduler \
            --port 8899" \
          "BENCH_MODEL=\${MODEL} GSM8K_TAG_PREFIX=stagger bash /workspace/run_client.sh 100:1000 200:2048"
