# Dev pipeline: validate the Qwen/Qwen3.6-35B-A3B bringup (UnitTest + Accuracy)
# on v6e-8, TP=8, before promoting the model yml to a PR. The commands here
# mirror .buildkite/models/Qwen_Qwen3_6-35B-A3B.yml verbatim.

steps:

  # Build the base image on the CPU builder and push it to the CI registry,
  # tagged ${commit}-tpu6e so the TPU steps below can pull it.
  - label: ":docker: Build and Push Base Image (tpu6e)"
    key: tpu6e_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu6e"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: "tpu6e Unit tests for Qwen/Qwen3.6-35B-A3B"
    key: tpu6e_Qwen_Qwen3_6-35B-A3B_UnitTest
    depends_on: tpu6e_build_docker
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu6e"
    agents:
      queue: tpu_v6e_8_queue
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh \
          bash -c 'USE_BATCHED_RPA_KERNEL=1 SKIP_JAX_PRECOMPILE=1 VLLM_XLA_CHECK_RECOMPILATION=0 python /workspace/tpu_inference/examples/offline_inference.py --model Qwen/Qwen3.6-35B-A3B --tensor-parallel-size 8 --max-num-batched-tokens 4096 --max-model-len 4096'

  # Qwen3.6 is a hybrid-thinking reasoning model: GSM8K must run with the
  # chat template, a reasoning-sized generation budget, and an <|im_end|>
  # stop override (the stock "Question:" stop list truncates thinking-mode
  # generations). EVAL_* knobs are set inline because run_in_docker.sh does
  # not forward them. EVAL_LIMIT=100 keeps the job ~35 min; the 0.90
  # threshold was calibrated on the same 100-example subset (measured 0.97).
  - label: "tpu6e Accuracy for Qwen/Qwen3.6-35B-A3B"
    key: tpu6e_Qwen_Qwen3_6-35B-A3B_Accuracy
    depends_on: tpu6e_Qwen_Qwen3_6-35B-A3B_UnitTest
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu6e"
      TEST_MODEL: Qwen/Qwen3.6-35B-A3B
      TENSOR_PARALLEL_SIZE: '8'
      MINIMUM_ACCURACY_THRESHOLD: '0.90'
      MODEL_IMPL_TYPE: vllm
    agents:
      queue: tpu_v6e_8_queue
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh bash -c 'USE_BATCHED_RPA_KERNEL=1 USE_CHAT_TEMPLATE=1 EVAL_MAX_MODEL_LEN=8192 EVAL_GEN_KWARGS="max_gen_toks=4096,until=<|im_end|>" EVAL_LIMIT=100 bash /workspace/tpu_inference/tests/e2e/benchmarking/test_accuracy.sh'
