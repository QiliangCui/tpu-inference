# Dev pipeline: multi-host serve + benchmark from a locally-built prebuilt image.
#
# Image is pushed off-pipeline as .../vllm-tpu:${COMMIT}-${VLLM_COMMIT_HASH}-${TPU_VERSION}
# (VLLM_COMMIT_HASH = .buildkite/vllm_lkg.version). USE_PREBUILT_IMAGE=1 +
# IS_MULTI_HOST_BENCH=true makes run_multihost.sh pull that tag and distribute it
# to all hosts; no build step needed.
#
# Serve config B: PP=4 x TP=8, EP, fp8 KV, token budget 1024, seqs 512,
# async stagger scheduler. Benchmark: random 8192/1024, range-ratio 0.8.

steps:
  # Gate: prove the gs:// loader + tokenizer + serve path on a single host
  # (~10 min) before committing the 32-device pod for hours.
  - label: "tpu7x [prebuilt] single-host serve gate"
    key: serve_gate
    timeout_in_minutes: 45
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
      MODEL_IMPL_TYPE: "vllm"
    agents:
      queue: tpu_v7x_2_queue
    commands:
      - .buildkite/scripts/run_in_docker.sh bash /workspace/gate_tiny_serve.sh

  - label: "tpu7x-32 [prebuilt] serve+bench arm B (C=512)"
    key: armb_c512
    depends_on: serve_gate
    timeout_in_minutes: 600
    env:
      USE_PREBUILT_IMAGE: "1"
      IS_MULTI_HOST_BENCH: "true"
      TPU_VERSION: "tpu7x"
      NEW_MODEL_DESIGN: "1"
      SERVER_READY_TIMEOUT: "14400"
      EXTRA_SERVER_ENVS: "MIN_TOKEN_BUCKET=16 VLLM_PP_LAYER_PARTITION=24,24,24,21 TPU_PP_TRANSPORT=auto DISABLE_WEIGHT_REQUANTIZATION=1 VLLM_ENGINE_READY_TIMEOUT_S=14400 JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS=0.05"
    agents:
      queue: tpu_v7x_32_queue
    commands:
      - |
        MODEL="gs://tpu-commons-ci/moonshootai/kimi/k3"
        .buildkite/scripts/run_multihost.sh \
          "vllm serve \${MODEL} \
            --trust-remote-code \
            --tensor-parallel-size 8 \
            --pipeline-parallel-size 4 \
            --distributed-executor-backend ray \
            --max-model-len 9216 \
            --max-num-batched-tokens 1024 \
            --max-num-seqs 512 \
            --gpu-memory-utilization 0.92 \
            --load-format runai_streamer \
            --additional-config '{\"sharding\":{\"sharding_strategy\":{\"enable_dp_attention\":true,\"attn_dp_size\":1}}}' \
            --no-enable-prefix-caching \
            --limit-mm-per-prompt '{\"image\":0,\"video\":0}' \
            --disable-chunked-mm-input \
            --kv-cache-dtype fp8 \
            --enable-expert-parallel \
            --scheduler-cls tpu_inference.core.sched.pp_stagger_scheduler.PpStaggerAsyncScheduler \
            --port 8899" \
          "bash /workspace/bench_sweep.sh"
