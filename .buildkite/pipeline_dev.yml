# Dev pipeline: re-test Qwen3.6-35B-A3B GSM8K accuracy WITH the chat template.
# Instruction/reasoning model: without apply_chat_template the eval scores ~0.30
# (vs published ~0.95). USE_CHAT_TEMPLATE=1 enables apply_chat_template +
# fewshot_as_multiturn in lm_eval (tpu_inference/scripts/vllm/integration/test_accuracy.py).

steps:
  - label: ":docker: Build and Push Base Image (tpu6e)"
    key: tpu6e_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu6e"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: "tpu6e Accuracy (chat-template) for Qwen/Qwen3.6-35B-A3B"
    key: tpu6e_Qwen_Qwen3_6_chat_Accuracy
    depends_on: tpu6e_build_docker
    soft_fail: true
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu6e"
      TEST_MODEL: "Qwen/Qwen3.6-35B-A3B"
      TENSOR_PARALLEL_SIZE: "8"
      MINIMUM_ACCURACY_THRESHOLD: "0.80"
      MODEL_IMPL_TYPE: "vllm"
      USE_CHAT_TEMPLATE: "1"
    agents:
      queue: tpu_v6e_8_queue
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh bash -c 'USE_BATCHED_RPA_KERNEL=1 USE_CHAT_TEMPLATE=1 bash /workspace/tpu_inference/tests/e2e/benchmarking/test_accuracy.sh'
