# Dev pipeline for tpu-inference-dev: MLA v2 kernel latency benchmark.
#
# Two steps only: build the image on CPU, then run
# scripts/bench_mla.sh on a single tpu7x host. The benchmark prints a
# JSON result block wrapped in ==RESULT START== / ==RESULT END==.

steps:

  - label: ":docker: Build and Push Base Image (tpu7x)"
    key: tpu7x_build_docker
    agents:
      queue: cpu_64_core
    env:
      TPU_VERSION: "tpu7x"
    commands:
      - bash -c 'source .buildkite/scripts/setup_docker_env.sh && setup_environment "vllm-tpu" "false" "true"'

  - label: "tpu7x MLA v2 kernel latency benchmark"
    key: tpu7x_mla_v2_bench
    depends_on: tpu7x_build_docker
    timeout_in_minutes: 90
    env:
      USE_PREBUILT_IMAGE: "1"
      TPU_VERSION: "tpu7x"
    agents:
      queue: tpu_v7x_2_queue
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh bash -c '
          cd /workspace/tpu_inference && bash scripts/bench_mla.sh'
